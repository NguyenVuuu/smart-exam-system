<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link id="app-favicon" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SOES - Smart Online Exam System</title>
    <script>
      (() => {
        const cacheKey = 'soes_public_system_settings'
        try {
          const settings = JSON.parse(localStorage.getItem(cacheKey) || 'null')
          if (!settings || typeof settings !== 'object') return

          const shortName = typeof settings.shortName === 'string' ? settings.shortName.trim() : ''
          const description = typeof settings.slogan === 'string' && settings.slogan.trim()
            ? settings.slogan.trim()
            : typeof settings.organizationName === 'string' && settings.organizationName.trim()
              ? settings.organizationName.trim()
              : 'Smart Online Exam System'
          if (shortName) document.title = `${shortName} - ${description}`

          const logoUrl = typeof settings.logoUrl === 'string' ? settings.logoUrl.trim() : ''
          if (/^(https?:\/\/|data:image\/)/i.test(logoUrl)) {
            const favicon = document.getElementById('app-favicon')
            if (favicon) favicon.href = logoUrl
          }
        } catch {
          localStorage.removeItem(cacheKey)
        }
      })()
    </script>
    <!-- Google Fonts: Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;0,900;1,400;1,500;1,700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
