name: Frontend CI

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: fe/soes-fe

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fe/soes-fe/package-lock.json

      - name: Create .env file
        run: echo "${{ secrets.FRONTEND_ENV }}" > .env

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Test vision workers
        run: npm run test:vision

      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium

      - name: Browser regression tests
        run: npx playwright test
        env:
          VITE_API_URL: http://127.0.0.1:3000/api

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/soes-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/soes-mobile/package-lock.json
      - run: npm ci
      - run: node node_modules/typescript/bin/tsc --noEmit
